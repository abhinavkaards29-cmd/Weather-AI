<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Area Search</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>
  <div class="app">
    <h1>🌍 Weather</h1>

    <input id="cityInput" placeholder="Area / City / Country" />
    <button id="searchBtn">Search</button>
    <div class="fav-actions">
     <button id="saveFavBtn">⭐ Save Favorite</button>
    </div>
<div id="favorites" class="favorites"></div>
    <button id="locBtn">📍 My Location</button>

    <div id="weatherCard" class="hidden">
      <h2 id="placeName"></h2>
      <h1 id="temp"></h1>
      <p id="desc"></p>
      <p id="extra"></p>
    </div>

    <div id="map"></div>
  </div>
<h3 class="section-title">Next Hours</h3>
<div id="hourlyForecast" class="hourly"></div>
  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
