<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Glass Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="glass">

    <header>
      <h1>🌤 Weather Glass</h1>
      <p class="subtitle">City • State • Country • Area</p>
    </header>

    <!-- SEARCH -->
    <div class="search-box">
      <input id="locationInput" placeholder="Enter city, area, state, country" />
      <button id="searchBtn">Search</button>
    </div>

    <!-- CURRENT WEATHER -->
    <section id="current" class="card hidden">
      <h2 id="place"></h2>
      <div class="temp" id="temp"></div>
      <p id="desc"></p>

      <div class="stats">
        <span id="feels"></span>
        <span id="humidity"></span>
        <span id="wind"></span>
      </div>

      <button id="voiceBtn">🔊 Speak Weather</button>
    </section>

    <!-- FORECAST -->
    <section id="forecast" class="card hidden">
      <h3>7-Day Forecast</h3>
      <div id="forecastList"></div>
    </section>

    <!-- MAP -->
    <section id="mapBox" class="card hidden">
      <h3>Location Map</h3>
      <iframe id="map"></iframe>
    </section>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
