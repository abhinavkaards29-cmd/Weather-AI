<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Glass</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
</head>

<body>
<div class="rain"></div>

<main class="glass">
  <h1>☁️ Weather Glass</h1>

  <input id="cityInput" placeholder="City / Area / Country">
  <button id="searchBtn">Search</button>
  <button id="locBtn">📍 Use My Location</button>

  <section id="current" class="hidden">
    <h2 id="place"></h2>
    <div id="temp"></div>
    <p id="desc"></p>
    <p id="extra"></p>
    <button id="voiceBtn">🔊 Speak Weather</button>
  </section>

  <section id="dailyBox" class="hidden">
    <h3>📅 7-Day Forecast</h3>
    <div id="daily"></div>
  </section>

  <section id="mapBox" class="hidden">
    <h3>📍 Location</h3>
    <iframe id="map" loading="lazy"></iframe>
  </section>

  <button id="installBtn" class="hidden">⬇️ Install App</button>
</main>

<script src="script.js"></script>
</body>
</html>
