<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Glass</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app glass">
  <h1>☁️ Weather Glass</h1>

  <input id="cityInput" placeholder="City / Area / Country">
  <button id="searchBtn">Search</button>
  <button id="locBtn">📍 Use My Location</button>

  <div id="weatherBox" class="hidden">
    <h2 id="place"></h2>
    <h1 id="temp"></h1>
    <p id="desc"></p>
    <p id="extra"></p>

    <button id="voiceBtn">🔊 Speak Weather</button>
  </div>

  <div id="forecast"></div>

  <iframe id="map"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</div>

<script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
</html>
