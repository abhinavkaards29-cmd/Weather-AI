<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Glass</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<main class="app">
  <h1>☁️ Weather Glass</h1>

  <input id="cityInput" placeholder="Search city" />
  <button id="searchBtn">Search</button>

  <section id="current" class="card hidden">
    <h2 id="place"></h2>
    <div id="temp"></div>
    <p id="desc"></p>
    <p id="extra"></p>
  </section>

  <section id="daily" class="card hidden">
    <h3>📅 7-Day Forecast</h3>
    <div id="dailyList"></div>
  </section>

  <section id="mapBox" class="card hidden">
    <h3>📍 Location</h3>
    <iframe id="map" loading="lazy"></iframe>
  </section>

  <div class="actions">
    <button id="favBtn">⭐ Favourite</button>
    <button id="remBtn">⏰ Reminder</button>
  </div>
</main>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
